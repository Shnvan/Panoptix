name: CI — Backend API

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, backend]
    paths:
      - "apps/api/**"
      - "apps/cctv-edge/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, backend]
    paths:
      - "apps/api/**"
      - "apps/cctv-edge/**"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/cctv_api/ --ignore-missing-imports

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t panoptix-api:ci ./apps/api

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python p/security-audit p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  osv-scanner:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --lockfile=apps/api/pyproject.toml
            --recursive

  trivy:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t panoptix-api:ci ./apps/api

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: panoptix-api:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  edge-agent:
    name: Edge Agent Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cctv-edge/agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: PYTHONPATH=src python -m ruff check src tests

      - name: Type check with mypy
        run: PYTHONPATH=src python -m mypy src/panoptix_edge_agent --ignore-missing-imports

      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -v

      - name: Compile check
        run: PYTHONPATH=src python -m compileall src tests
