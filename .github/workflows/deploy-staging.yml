name: Deploy — Staging

permissions:
  contents: read

on:
  push:
    branches: [backend]
    paths:
      - "apps/api/**"
      - "apps/cctv-edge/**"
  workflow_dispatch:

jobs:
  notify-and-verify:
    name: Notify and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Deployment notice
        run: |
          echo "Railway auto-deploys from the \`backend\` branch to the staging service."
          echo "Commit SHA : ${{ github.sha }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Branch     : ${{ github.ref_name }}"

      - name: Wait for Railway deploy
        run: sleep 45

      - name: Post-deploy health probe (informational)
        run: |
          echo "Probing staging /health (informational — CF Access may redirect unauthenticated requests)..."
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 15 https://staging.panoptix.site/health || echo "000")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::warning::Could not reach staging.panoptix.site — Railway may still be deploying."
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "Staging /health returned 200 — healthy."
          else
            echo "::notice::Staging /health returned $HTTP_CODE (CF Access redirect is expected for unauthenticated probes). The staging-healthcheck cron will verify with auth."
          fi

      - name: Write job summary
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Staging Deployment Summary

          | Field | Value |
          |---|---|
          | **Commit SHA** | ${{ github.sha }} |
          | **Branch** | ${{ github.ref_name }} |
          | **Actor** | ${{ github.actor }} |
          | **Timestamp** | $TIMESTAMP |
          | **Status** | Success |
          EOF
