name: Production Backup

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 18:15 UTC = 02:15 Asia/Manila next day.
    - cron: "15 18 * * *"
  workflow_dispatch:

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted R2 Backup And Retention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install API package
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run encrypted production backup
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run --service panoptix-control --environment production --no-local -- python -m cctv_api.jobs.backup_r2

      - name: Apply production backup retention
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run --service panoptix-control --environment production --no-local -- python -m cctv_api.jobs.backup_retention_r2

      - name: Open or update backup failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production backup automation failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled production backup workflow failed. Review the workflow run and Railway/R2 configuration.",
              "",
              "| Field | Value |",
              "| --- | --- |",
              `| Workflow | ${context.workflow} |`,
              `| Run ID | ${context.runId} |`,
              `| Actor | ${context.actor} |`,
              `| SHA | ${context.sha} |`,
              `| Run | ${runUrl} |`,
              "",
              "Do not paste object keys, database URLs, R2 secrets, private age identities, or decrypted backup contents into this issue.",
            ].join("\n");

            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = existingIssues.find(issue => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing issue #${existing.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Created issue #${issue.number}.`);
            }
