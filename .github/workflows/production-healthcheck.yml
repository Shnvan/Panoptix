name: Production Health Check

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Create a controlled sanitized monitoring failure for issue-path testing"
        required: false
        type: boolean
        default: false

jobs:
  healthcheck:
    name: Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate monitoring credentials
        env:
          PRODUCTION_CF_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_ID }}
          PRODUCTION_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_CF_ACCESS_CLIENT_ID}" ] || [ -z "${PRODUCTION_CF_ACCESS_CLIENT_SECRET}" ]; then
            echo "::error::Missing PRODUCTION_CF_ACCESS_CLIENT_ID or PRODUCTION_CF_ACCESS_CLIENT_SECRET repository secret."
            echo "::error::Configure a Cloudflare Access service token for the production monitor before this workflow can probe protected endpoints."
            exit 1
          fi

      - name: Check /health endpoint
        id: check_shallow
        env:
          PRODUCTION_CF_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_ID }}
          PRODUCTION_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          BODY_FILE="$(mktemp)"
          set +e
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out "%{http_code}" --max-time 20 \
            -H "CF-Access-Client-Id: ${PRODUCTION_CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${PRODUCTION_CF_ACCESS_CLIENT_SECRET}" \
            https://panoptix.site/health)
          CURL_EXIT=$?
          set -e

          HTTP_CODE="${HTTP_CODE:-000}"
          set_output "http_code" "$HTTP_CODE"

          if [ "$CURL_EXIT" -ne 0 ]; then
            set_output "shallow_ok" "false"
            set_output "shallow_fail_reason" "curl failed with exit ${CURL_EXIT}"
          elif [ "$HTTP_CODE" != "200" ]; then
            set_output "shallow_ok" "false"
            if [ "$HTTP_CODE" = "302" ]; then
              set_output "shallow_fail_reason" "Expected HTTP 200 but got 302 Cloudflare Access redirect. Check production monitor service-token policy and headers."
            else
              set_output "shallow_fail_reason" "Expected HTTP 200 but got ${HTTP_CODE}"
            fi
          elif SUMMARY=$(PYTHONPATH=apps/api/src python3 -m cctv_api.monitoring shallow "$BODY_FILE"); then
            set_output "shallow_ok" "true"
          else
            set_output "shallow_ok" "false"
            set_output "shallow_fail_reason" "$SUMMARY"
          fi

      - name: Check /api/v1/admin/health/deep endpoint
        id: check_deep
        env:
          PRODUCTION_CF_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_ID }}
          PRODUCTION_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_SECRET }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || false }}
        run: |
          set -euo pipefail

          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          BODY_FILE="$(mktemp)"
          set +e
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out "%{http_code}" --max-time 20 \
            -H "CF-Access-Client-Id: ${PRODUCTION_CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${PRODUCTION_CF_ACCESS_CLIENT_SECRET}" \
            https://panoptix.site/api/v1/admin/health/deep)
          CURL_EXIT=$?
          set -e

          HTTP_CODE="${HTTP_CODE:-000}"
          set_output "http_code" "$HTTP_CODE"

          if [ "$CURL_EXIT" -ne 0 ]; then
            set_output "deep_ok" "false"
            set_output "deep_fail_reason" "curl failed with exit ${CURL_EXIT}"
          elif [ "$HTTP_CODE" != "200" ]; then
            set_output "deep_ok" "false"
            if [ "$HTTP_CODE" = "302" ]; then
              set_output "deep_fail_reason" "Expected HTTP 200 but got 302 Cloudflare Access redirect. Check production monitor service-token policy and headers."
            else
              set_output "deep_fail_reason" "Expected HTTP 200 but got ${HTTP_CODE}"
            fi
          elif [ "$SIMULATE_FAILURE" = "true" ]; then
            set_output "deep_ok" "false"
            set_output "deep_fail_reason" "controlled monitoring failure simulation"
          elif SUMMARY=$(PYTHONPATH=apps/api/src python3 -m cctv_api.monitoring deep "$BODY_FILE"); then
            set_output "deep_ok" "true"
          else
            set_output "deep_ok" "false"
            set_output "deep_fail_reason" "$SUMMARY"
          fi

      - name: File issue on failure
        if: steps.check_shallow.outputs.shallow_ok == 'false' || steps.check_deep.outputs.deep_ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          SHALLOW_OK: ${{ steps.check_shallow.outputs.shallow_ok }}
          SHALLOW_REASON: ${{ steps.check_shallow.outputs.shallow_fail_reason }}
          DEEP_OK: ${{ steps.check_deep.outputs.deep_ok }}
          DEEP_REASON: ${{ steps.check_deep.outputs.deep_fail_reason }}
        run: |
          set -euo pipefail

          TITLE="Production health check failed"
          ISSUES_FILE="$(mktemp)"

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/issues?state=open&per_page=100" \
            -o "$ISSUES_FILE"

          ALREADY_OPEN=$(python3 - "$ISSUES_FILE" "$TITLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          issues = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          title = sys.argv[2]
          print("true" if any(issue.get("title") == title for issue in issues) else "false")
          PY
          )

          if [ "$ALREADY_OPEN" = "true" ]; then
            echo "An open production health issue already exists; skipping creation."
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          python3 - "$BODY_FILE" <<'PY'
          import os
          import sys
          from pathlib import Path

          def escape_table(value: str) -> str:
              return (value or "-").replace("|", "\\|")

          shallow_ok = os.environ["SHALLOW_OK"] == "true"
          deep_ok = os.environ["DEEP_OK"] == "true"
          lines = [
              "One or more production health checks failed. Details below.",
              "",
              "| Endpoint | Result | Details |",
              "| --- | --- | --- |",
          ]

          if shallow_ok:
              lines.append("| `GET /health` | OK | - |")
          else:
              lines.append(
                  f"| `GET /health` | FAILED | {escape_table(os.environ.get('SHALLOW_REASON', 'missing reason'))} |"
              )

          if deep_ok:
              lines.append("| `GET /api/v1/admin/health/deep` | OK | - |")
          else:
              lines.append(
                  f"| `GET /api/v1/admin/health/deep` | FAILED | {escape_table(os.environ.get('DEEP_REASON', 'missing reason'))} |"
              )

          lines.extend(
              [
                  "",
                  f"_Workflow run: {os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}_",
              ]
          )
          Path(sys.argv[1]).write_text("\n".join(lines), encoding="utf-8")
          PY

          PAYLOAD_FILE="$(mktemp)"
          python3 - "$TITLE" "$BODY_FILE" "$PAYLOAD_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          title = sys.argv[1]
          body = Path(sys.argv[2]).read_text(encoding="utf-8")
          Path(sys.argv[3]).write_text(
              json.dumps({"title": title, "body": body}),
              encoding="utf-8",
          )
          PY

          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/issues" \
            --data @"$PAYLOAD_FILE" \
            >/dev/null

      - name: Fail workflow on health check failure
        if: steps.check_shallow.outputs.shallow_ok == 'false' || steps.check_deep.outputs.deep_ok == 'false'
        run: |
          echo "::error::One or more production health checks failed."
          exit 1
