[project]
name = "panoptix-edge-agent"
version = "0.1.0"
description = "Panoptix gateway heartbeat agent"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
livekit = [
    "livekit>=1.1,<2",
]

[project.scripts]
panoptix-edge-agent = "panoptix_edge_agent.cli:main"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
